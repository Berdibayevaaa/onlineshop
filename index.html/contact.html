<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Store | Contact</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Fixed Header with Bootstrap Toggler -->
  <header class="navbar navbar-expand-lg custom-header">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-3 text-dark" href="index.html">
        Aura<span class="text-primary">Store</span>
      </a>

      <!-- Hamburger Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Menu -->
      <nav class="collapse navbar-collapse justify-content-end" id="mainNavbar" aria-label="Main navigation">
        <ul class="navbar-nav gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold text-primary" href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h1 class="text-center mb-4">Get In Touch</h1>
        <form class="p-4 border rounded shadow-sm bg-white">
          <div class="mb-3">
            <label for="userName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="userName" placeholder="Your Name" required>
          </div>
          <div class="mb-3">
            <label for="userEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label for="interest" class="form-label">Category of Inquiry</label>
            <select class="form-select" id="interest">
              <option value="clothes">Clothes & Sizing</option>
              <option value="gadgets">Gadgets & Tech Support</option>
              <option value="cosmetics">Cosmetics & Ingredients</option>
              <option value="other">General Question</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="userMessage" class="form-label">Your Message</label>
            <textarea class="form-control" id="userMessage" rows="4" placeholder="Write your inquiry..." required></textarea>
          </div>
          <button type="submit" class="btn btn-custom w-100">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-1">&copy; 2026 Aura Store. All rights reserved.</p>
      <p class="small mb-2">Astana, Kazakhstan | <a href="mailto:info@aurastore.kz">info@aurastore.kz</a></p>
      <nav aria-label="Social media">
        <ul class="footer-social list-inline mb-0">
          <li class="list-inline-item"><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
          <li class="list-inline-item"><a href="https://t.me/" target="_blank" rel="noopener noreferrer">Telegram</a></li>
          <li class="list-inline-item"><a href="https://x.com/" target="_blank" rel="noopener noreferrer">X</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
